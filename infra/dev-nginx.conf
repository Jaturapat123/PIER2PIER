# nginx ทำหน้าที่แทน ALB บนเครื่องพัฒนา
#
# ค่าที่ตั้งไว้พยายามเลียนพฤติกรรม ALB ให้ใกล้เคียง: กระจายแบบ round-robin,
# ถอดเครื่องที่ล้มออกชั่วคราว และส่ง header ต้นทางต่อไปให้แอป

upstream wms_api {
    server api-a:3000 max_fails=2 fail_timeout=10s;
    server api-b:3000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://wms_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ถ้าเครื่องหนึ่งล้มกลางคัน ให้ลองเครื่องถัดไปทันที — พฤติกรรมเดียวกับ ALB
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 2s;
    }
}
