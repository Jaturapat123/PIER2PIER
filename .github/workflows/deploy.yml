name: Deploy

# ทำงานเมื่อโค้ดถูก merge เข้า main แล้วเท่านั้น
# เรียกเองจากหน้า Actions ได้ด้วยเผื่อต้อง deploy ซ้ำ
on:
  push:
    branches: [main]
  workflow_dispatch:

# ไม่ขอ id-token อีกแล้ว เพราะใช้ OIDC ไม่ได้
#
# เดิมใช้ GitHub OIDC แลก temporary credential ซึ่งปลอดภัยกว่าและไม่ต้องเก็บ secret
# แต่ AWS Academy Learner Lab สร้าง IAM role ให้ GitHub ไม่ได้ —
# `aws iam list-open-id-connect-providers` คืนค่าว่าง และ `iam:CreateRole` ถูกปฏิเสธ
# (ยืนยันจากบัญชีจริง ดู instruction.md §2.5)
#
# จึงต้องใช้ credential ชั่วคราวจากหน้า "AWS Details" ของแล็บ ซึ่งมีสามค่า
# และ **หมดอายุทุกครั้งที่ปิดแล็บ** ผู้ดูแล repo ต้องเอาค่าใหม่ไปใส่
# Settings → Secrets and variables → Actions ทุกครั้งที่เริ่ม session ใหม่:
#   AWS_ACCESS_KEY_ID · AWS_SECRET_ACCESS_KEY · AWS_SESSION_TOKEN
#
# ต้องมี AWS_SESSION_TOKEN ด้วย — credential ของแล็บเป็นแบบ STS ชั่วคราว
# ถ้าใส่แค่สองค่าแรก ทุกคำสั่ง aws จะได้ InvalidClientTokenId
permissions:
  contents: read

# ห้าม deploy ซ้อนกัน ถ้ามีตัวใหม่มาให้รอตัวเก่าจบก่อน
# ไม่งั้นสองงานจะแย่งกันเปลี่ยน container บนเครื่องเดียวกัน
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Learner Lab อนุญาตเฉพาะ us-east-1 และ us-west-2
  AWS_REGION: us-east-1
  PROJECT: pier2pier-dev

jobs:
  test:
    name: 1. ทดสอบก่อน deploy
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: pier2pier_wms
          MYSQL_USER: wms
          MYSQL_PASSWORD: wmspass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uwms -pwmspass"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm, cache-dependency-path: backend/package-lock.json }

      - run: npm ci
        working-directory: backend

      - run: npm run migrate && npm run seed && npm test
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: wms
          DB_PASSWORD: wmspass
          DB_NAME: pier2pier_wms
          JWT_SECRET: ci-test-secret

  build:
    name: 2. Build และ push image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v7

      - name: กำหนดแท็กจาก git SHA
        id: meta
        # ใช้ SHA เป็นแท็กเพราะย้อนกลับได้ — ถ้าใช้แต่ latest จะไม่มีทางรู้ว่า
        # เวอร์ชันก่อนหน้าคืออันไหน และ rollback ไม่ได้
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build และ push
        run: |
          REPO="${{ steps.ecr.outputs.registry }}/${PROJECT}-api"
          TAG="${{ steps.meta.outputs.tag }}"

          # ไม่ต้องส่ง GIT_SHA เข้าไปตอน build เพราะ deploy-app.sh บนเครื่อง
          # เขียนค่านี้ลง /etc/pier2pier.env ตอน deploy อยู่แล้ว
          # image เดียวกันจึงใช้ได้ทุกสภาพแวดล้อมโดยไม่ต้อง build ซ้ำ
          docker build -t "$REPO:$TAG" -t "$REPO:latest" ./backend

          docker push "$REPO:$TAG"
          docker push "$REPO:latest"

          echo "### Image ที่ build" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$REPO:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-api:
    name: 3. Deploy ทีละเครื่อง
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: หา instance และ target group
        id: infra
        run: |
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=pier2pier" \
                      "Name=tag:Role,Values=application" \
                      "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId" --output text)

          TG=$(aws elbv2 describe-target-groups \
            --names "${PROJECT}-tg" \
            --query "TargetGroups[0].TargetGroupArn" --output text)

          echo "instance_ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "target_group=$TG" >> "$GITHUB_OUTPUT"
          echo "จะ deploy ไปยังเครื่อง: $IDS"

      - name: Deploy แบบทีละเครื่อง (rolling)
        # หัวใจของขั้นนี้: deploy เครื่องหนึ่ง รอจนมันกลับมา healthy จริง
        # แล้วค่อยไปเครื่องถัดไป ระหว่างนั้นอีกเครื่องยังรับผู้ใช้อยู่ = ไม่มี downtime
        run: |
          set -euo pipefail
          REPO=$(aws ecr describe-repositories --repository-names "${PROJECT}-api" \
                   --query "repositories[0].repositoryUri" --output text)
          TAG="${{ needs.build.outputs.image_tag }}"
          TG="${{ steps.infra.outputs.target_group }}"

          for ID in ${{ steps.infra.outputs.instance_ids }}; do
            echo "::group::Deploy $ID"

            CMD=$(aws ssm send-command \
              --instance-ids "$ID" \
              --document-name "AWS-RunShellScript" \
              --comment "deploy $TAG" \
              --parameters "commands=[\"/usr/local/bin/deploy-app.sh ${AWS_REGION} $REPO $TAG\"]" \
              --query "Command.CommandId" --output text)

            aws ssm wait command-executed --command-id "$CMD" --instance-id "$ID" || {
              echo "การ deploy ที่เครื่อง $ID ล้มเหลว — หยุดทันที ไม่ไปเครื่องถัดไป"
              aws ssm get-command-invocation --command-id "$CMD" --instance-id "$ID" \
                --query "StandardErrorContent" --output text
              exit 1
            }

            echo "รอให้ ALB ยืนยันว่าเครื่องนี้ healthy ก่อนไปเครื่องถัดไป"
            for i in $(seq 1 40); do
              STATE=$(aws elbv2 describe-target-health \
                --target-group-arn "$TG" --targets "Id=$ID" \
                --query "TargetHealthDescriptions[0].TargetHealth.State" --output text)
              echo "  สถานะ: $STATE"
              [ "$STATE" = "healthy" ] && break
              [ "$i" = "40" ] && { echo "เครื่อง $ID ไม่กลับมา healthy — หยุด deploy"; exit 1; }
              sleep 5
            done

            echo "::endgroup::"
          done

      - name: ทดสอบว่าเวอร์ชันใหม่ขึ้นจริงผ่าน Load Balancer
        run: |
          set -euo pipefail
          ALB=$(aws elbv2 describe-load-balancers --names "${PROJECT}-alb" \
                  --query "LoadBalancers[0].DNSName" --output text)
          TAG="${{ needs.build.outputs.image_tag }}"

          # ยิงหลายครั้งเพื่อให้แน่ใจว่าโดนทุกเครื่อง ไม่ใช่เครื่องเดียวที่บังเอิญอัปเดตแล้ว
          for i in $(seq 1 10); do
            SHA=$(curl -fsS "http://$ALB/health" | grep -o '"gitSha":"[^"]*"' | cut -d'"' -f4)
            echo "คำขอที่ $i -> เวอร์ชัน $SHA"
            [ "$SHA" = "$TAG" ] || { echo "ยังมีเครื่องที่รันเวอร์ชันเก่าอยู่"; exit 1; }
          done

          echo "### Deploy สำเร็จ" >> "$GITHUB_STEP_SUMMARY"
          echo "ทุกเครื่องรันเวอร์ชัน \`$TAG\` แล้ว · http://$ALB" >> "$GITHUB_STEP_SUMMARY"

  deploy-frontend:
    name: 4. Deploy frontend
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: หาที่อยู่ของ API ที่จะฝังลงไปตอน build
        id: api
        # ไม่มี CloudFront แล้ว หน้าเว็บ (S3) กับ API (ALB) จึงอยู่คนละ origin
        # frontend ต้องรู้ที่อยู่ของ ALB ตั้งแต่ตอน build เพราะ Vite แทนค่า
        # import.meta.env ลงไปในไฟล์ JS ตอน build ไม่ใช่ตอน runtime
        # เปลี่ยนที่อยู่ API ทีหลังโดยไม่ build ใหม่จึงทำไม่ได้
        #
        # อ่านจาก ALB จริงด้วย describe-load-balancers แทนการเก็บเป็น secret
        # เพราะชื่อ DNS ของ ALB เปลี่ยนทุกครั้งที่ terraform สร้างใหม่
        # ซึ่งในแล็บเกิดบ่อยเพราะต้อง destroy ทิ้งเพื่อคุมงบ
        run: |
          set -euo pipefail
          ALB=$(aws elbv2 describe-load-balancers --names "${PROJECT}-alb" \
                  --query "LoadBalancers[0].DNSName" --output text)
          echo "base_url=http://$ALB" >> "$GITHUB_OUTPUT"
          echo "จะ build ให้ frontend เรียก API ที่ http://$ALB"

      - name: Build
        # เป็น http:// ไม่ใช่ https:// เพราะ ALB ไม่มีใบรับรอง ACM
        # และไม่เกิด mixed content เพราะหน้าเว็บที่เสิร์ฟจาก S3 website endpoint
        # ก็เป็น HTTP เหมือนกัน — ทั้งระบบเป็น HTTP ทั้งหมด (ข้อจำกัดของ Learner Lab)
        run: |
          npm ci
          npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.api.outputs.base_url }}

      - name: อัปโหลดขึ้น S3
        run: |
          BUCKET="${PROJECT}-web"

          # ไฟล์ที่มี hash ในชื่ออยู่แล้ว cache ได้ยาว ๆ เพราะชื่อจะเปลี่ยนเมื่อเนื้อหาเปลี่ยน
          aws s3 sync dist/ "s3://$BUCKET/" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          # index.html ห้าม cache เด็ดขาด ไม่งั้นผู้ใช้จะยังได้หน้าเก่าที่ชี้ไปไฟล์ที่ถูกลบแล้ว
          aws s3 cp dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"
        working-directory: frontend

      # เดิมมีขั้นตอน "ล้าง cache ของ CloudFront" ตรงนี้ — ลบออกแล้วเพราะไม่มี CloudFront
      # ไม่มีอะไรต้องล้างแทน: ไฟล์ asset มี hash ในชื่อจึงเปลี่ยนชื่อเองเมื่อเนื้อหาเปลี่ยน
      # และ index.html อัปโหลดด้วย no-cache อยู่แล้ว เบราว์เซอร์จึงเห็นของใหม่ทันที

      - name: สรุปที่อยู่หน้าเว็บ
        run: |
          set -euo pipefail
          # ประกอบชื่อเองเพราะ AWS CLI ไม่มีคำสั่งที่คืน website endpoint ให้
          # (get-bucket-website บอกแค่ index/error document) ค่าที่เชื่อถือได้คือ
          # output `web_endpoint` ของ Terraform — ตรงนี้ใช้แค่แสดงใน summary
          # รูปแบบใช้ขีดคั่น (s3-website-<region>) ซึ่งถูกต้องสำหรับ us-east-1
          BUCKET="${PROJECT}-web"
          ENDPOINT="http://${BUCKET}.s3-website-${AWS_REGION}.amazonaws.com"

          {
            echo "### Frontend ขึ้นแล้ว"
            echo ""
            echo "- หน้าเว็บ: $ENDPOINT"
            echo "- API ที่ฝังไว้ตอน build: ${{ steps.api.outputs.base_url }}"
            echo "- ทั้งคู่เป็น HTTP — S3 website endpoint ไม่รองรับ HTTPS"
          } >> "$GITHUB_STEP_SUMMARY"
